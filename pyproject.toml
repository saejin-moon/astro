[project]
name = "astropolitics"
version = "0.1.0"
description = "Astropolitical inequity research toolkit using CelesTrak satellite data and 30-day SGP4 propagation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sgp4>=2.23",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "requests>=2.28",
    "skyfield>=1.46",
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "ipywidgets>=8.1",
    "pytest>=7.4"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
